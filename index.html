<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חווית קניות · בוטיק</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f4f0;
            background: linear-gradient(145deg, #faf8f6 0%, #f0ebe6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 3.5rem 3.5rem 4rem;
            box-shadow: 0 20px 60px -12px rgba(80, 60, 50, 0.15), 0 0 0 1px rgba(200, 180, 170, 0.2);
            transition: 0.3s ease;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9b5a8, #b8a092, #c9b5a8, transparent);
            border-radius: 0 0 4px 4px;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.8rem;
        }

        .hero h1 {
            font-size: 3.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #3d2e26;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            margin-bottom: 0.2rem;
        }

        .hero h1 span {
            font-weight: 600;
            color: #8a7264;
        }

        .hero .divider {
            width: 60px;
            height: 2px;
            background: #d4c5ba;
            margin: 0.8rem auto 1rem;
        }

        .subhead {
            font-size: 1.2rem;
            font-weight: 300;
            color: #9a8a7e;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-family: 'Segoe UI', 'Helvetica', sans-serif;
        }

        .subhead span {
            background: #f5f0ec;
            padding: 0.2rem 1.8rem;
            border-radius: 40px;
            letter-spacing: 4px;
            font-weight: 400;
            color: #7a6a5e;
        }

        .btn-start-wrapper {
            display: flex;
            justify-content: center;
            margin: 2.8rem 0 3rem;
        }

        .btn-start {
            background: #d4c5ba;
            background: linear-gradient(135deg, #dfd2c8, #cbb9ad);
            border: none;
            border-radius: 60px;
            padding: 1.2rem 4.5rem;
            font-size: 2.2rem;
            font-weight: 400;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(80, 60, 50, 0.15);
            box-shadow: 0 10px 30px -8px rgba(160, 140, 130, 0.3), 0 0 0 1px rgba(200, 180, 170, 0.15);
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e6d9cf, #d2c0b4);
            box-shadow: 0 16px 40px -10px rgba(160, 140, 130, 0.4), 0 0 0 1px rgba(200, 180, 170, 0.2);
        }

        .btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 6px 20px -6px rgba(160, 140, 130, 0.3);
        }

        /* ===== רשימה מימין לשמאל - תיקון ===== */
        .steps {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 0;
            margin: 2.2rem 0 2.5rem;
            list-style: none;
            width: 100%;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 1.4rem;
            font-weight: 300;
            color: #5a4a3e;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 400px;
            padding: 0.3rem 0;
            border-bottom: 1px solid #f0ebe6;
            transition: all 0.2s ease;
            direction: rtl;
            justify-content: flex-start;
        }

        .step-item:last-child {
            border-bottom: none;
        }

        .step-item .number {
            font-size: 1.6rem;
            font-weight: 300;
            color: #c9b5a8;
            font-family: 'Georgia', serif;
            min-width: 2.2rem;
            text-align: center;
            order: 0;
        }

        .step-item .label {
            font-weight: 300;
            color: #7a6a5e;
            font-size: 1.3rem;
            order: 1;
        }

        .step-item:last-child .number {
            color: #b8a092;
        }

        .step-item:last-child .label {
            color: #8a7264;
            font-weight: 400;
        }

        /* ===== תגית חיסכון ===== */
        .savings-badge {
            background: #f5f0ec;
            color: #5a4a3e;
            font-size: 1.6rem;
            font-weight: 300;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            padding: 0.5rem 3rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #e0d6ce;
            letter-spacing: 2px;
            box-shadow: 0 2px 12px rgba(160, 140, 130, 0.06);
        }

        .savings-badge strong {
            font-weight: 600;
            color: #8a7264;
        }

        .disclaimer {
            background: #faf7f4;
            padding: 1.2rem 2rem;
            border-radius: 60px;
            color: #9a8a7e;
            font-size: 1.05rem;
            font-weight: 300;
            text-align: center;
            margin: 2.8rem 0 0.5rem;
            border: 1px solid #ede7e2;
            font-family: 'Segoe UI', 'Helvetica', sans-serif;
            letter-spacing: 0.3px;
            line-height: 1.6;
        }

        .disclaimer i {
            font-style: normal;
            background: #ede7e2;
            color: #7a6a5e;
            padding: 0.05rem 0.8rem;
            border-radius: 30px;
            margin: 0 0.2rem;
            font-size: 0.95rem;
        }

        .disclaimer strong {
            font-weight: 500;
            color: #7a6a5e;
        }

        @media (max-width: 700px) {
            .card {
                padding: 2rem 1.5rem 2.5rem;
            }
            .hero h1 {
                font-size: 2.6rem;
                letter-spacing: 2px;
            }
            .subhead {
                font-size: 0.95rem;
                letter-spacing: 4px;
            }
            .btn-start {
                font-size: 1.8rem;
                padding: 1rem 2.5rem;
                max-width: 100%;
            }
            .step-item {
                font-size: 1.2rem;
                gap: 1rem;
                max-width: 100%;
            }
            .step-item .number {
                font-size: 1.3rem;
                min-width: 1.8rem;
            }
            .step-item .label {
                font-size: 1.1rem;
            }
            .savings-badge {
                font-size: 1.3rem;
                padding: 0.3rem 2rem;
            }
            .disclaimer {
                font-size: 0.9rem;
                padding: 1rem 1.2rem;
            }
        }

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap');
    </style>
</head>
<body>
<div class="card">

    <div class="hero">
        <h1>חווית <span>קניות</span></h1>
        <div class="divider"></div>
        <div class="subhead"><span>ללא כסף</span></div>
    </div>

    <div class="btn-start-wrapper">
        <button class="btn-start" onclick="window.location.href='stores.html'">
            התחל בקניות
        </button>
    </div>

    <!-- רשימה מימין לשמאל -->
    <div class="steps">
        <div class="step-item">
            <span class="number">1</span>
            <span class="label">בחרי מוצרים</span>
        </div>
        <div class="step-item">
            <span class="number">2</span>
            <span class="label">מלאי את הסל</span>
        </div>
        <div class="step-item">
            <span class="number">3</span>
            <span class="label">שלמי בכאילו</span>
        </div>
        <div class="step-item">
            <span class="number">4</span>
            <span class="label">חכי למשלוח</span>
        </div>
        <div class="step-item">
            <span class="number">💰</span>
            <span class="label">וחסכת</span>
        </div>
    </div>

    <div style="text-align: center;">
        <span class="savings-badge">💸 חסכת <strong>0₪</strong> · עדיין לא התחלת</span>
    </div>

    <div class="disclaimer">
        <i>🧠</i>   שים לב   <i>🧾</i><br>
        כל הפעולות כאן הן <strong>סימולציה</strong> — אין קנייה אמיתית, אין שליח אמיתי, ואין כסף אמיתי.
        זוהי חוויה דמיונית לראות "כמה חסכת".
    </div>

</div>
</body>
</html>
